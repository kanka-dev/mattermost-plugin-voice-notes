name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Create build/bin directory
        run: mkdir -p build/bin

      - name: Build plugin
        run: make dist
        env:
          GO_BUILD_FLAGS: "-ldflags='-s -w'"

      - name: List dist directory
        if: always()
        run: ls -lah dist/ || echo "dist/ does not exist"

      - name: Get plugin version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Voice Notes ${{ github.ref_name }}
          body: |
            ## Installation

            1. Download `dev.kanka.voice-notes-${{ steps.version.outputs.version }}.tar.gz` below.
            2. In Mattermost: **System Console → Plugins → Plugin Management → Upload Plugin**.
            3. Enable the plugin.

            See [CHANGELOG.md](https://github.com/kanka-dev/mattermost-plugin-voice-notes/blob/main/CHANGELOG.md) for what changed in this release.
          files: dist/dev.kanka.voice-notes-*.tar.gz
          fail_on_unmatched_files: true
